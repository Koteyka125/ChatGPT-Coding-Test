<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
</head>
<body>
<main>
  <h1>Вход</h1>
  {% if error %}<p>{{ error }}</p>{% endif %}
  <form method="post">
    <label>Имя пользователя <input name="username" maxlength="80" required autofocus></label>
    <label>Пароль <input name="password" type="password" required></label>
    <button type="submit">Войти</button>
  </form>
  <p><a href="{{ url_for('register') }}">Создать аккаунт</a></p>
</main>
</body>
</html>
