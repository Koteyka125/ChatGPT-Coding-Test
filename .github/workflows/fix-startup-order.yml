name: Fix startup order

on:
  push:
    branches: [fix/startup-order]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move database bootstrap after helper definitions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text()
          old = "\n\ninit_db()\n\n\n@app.before_request\n"
          new = "\n\n@app.before_request\n"
          if old not in text:
              raise SystemExit("startup marker not found")
          text = text.replace(old, new, 1)
          if not text.endswith("\n"):
              text += "\n"
          text += "\ninit_db()\n"
          path.write_text(text)
          PY

      - name: Verify import and tests
        run: |
          python -m pytest -q
          python -c "import app; print('app import ok')"

      - name: Commit hotfix
        run: |
          rm -f .github/workflows/fix-startup-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/fix-startup-order.yml
          git commit -m "Fix startup initialization order"
          git push
